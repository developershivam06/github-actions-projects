name: Build python Package

on:
  push:
    branches:
      - main
      - feature/project-2-build-package

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build python package for our calculator project

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: |
          python -m build

      - name: Show generated files
        run: |
          ls -lh dist/